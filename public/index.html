<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#d9cbdf" />
<title>SHUSHU/TONG — Your Other Identity</title>
<style>
:root{--ink:#685176;--white:#fffc;--shadow:#68547675}
*{box-sizing:border-box}
html{background:#d7d0e8}
body{margin:0;color:white;font-family:Georgia,'Times New Roman',serif}
.app{position:relative;min-height:100dvh;max-width:510px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 17px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 20% 10%,#fff9,transparent 35%),linear-gradient(153deg,#bca9cf 5%,#edcbd7 42%,#aaa1c7 100%);overflow:hidden;isolation:isolate}
.app[data-look="blue"]{background:radial-gradient(ellipse at 20% 10%,#fff9,transparent 35%),linear-gradient(155deg,#9db2d4 5%,#d7e2fb 42%,#aaa6d5 100%)}
.app:before{content:"";position:absolute;inset:11px;border:1px solid #fffa;border-radius:20px;box-shadow:inset 0 0 0 5px #ffffff60;pointer-events:none}
.brand,.look-switch,.actions,.note,.message{position:relative;z-index:2}
.brand{text-align:center;margin-bottom:16px}
.brand h1{margin:0;font:italic 900 clamp(28px,8.5vw,41px) Arial,sans-serif;letter-spacing:-2px;color:#df1938;text-shadow:1px 1px #fff}
.brand p{font-size:10px;letter-spacing:2.6px;margin:8px 0 0;text-shadow:0 1px 4px #7b6184}
.ornament{text-align:center;color:white;font-size:19px;letter-spacing:17px;margin:15px 0;text-shadow:0 0 10px white}
.look-switch{display:flex;justify-content:center;gap:10px;margin:0 0 16px}
.look-switch button,.action{font:12px Georgia,serif;letter-spacing:.7px;border:1px solid #fff9;border-radius:30px;padding:12px 16px;color:var(--ink);background:#fffc;box-shadow:0 3px 14px var(--shadow);cursor:pointer}
.look-switch button{font-size:11px;flex:1;max-width:180px}
.look-switch button[aria-pressed=true]{background:#837296;color:white}
.app[data-look="blue"] .look-switch button[aria-pressed=true]{background:#7898bc}
.stage{position:relative;z-index:1;width:100%;height:min(64dvh,650px);min-height:330px;overflow:hidden;border:7px double #fffde8;border-radius:45% 45% 10% 10%/11% 11% 5% 5%;background:radial-gradient(ellipse at 50% 50%,#e3e2f8,#9d91ba);box-shadow:0 15px 36px #5b506d77,inset 0 0 24px #fff8}
.stage:after{content:"";position:absolute;inset:8px;border:1px solid #ffeacd90;border-radius:inherit;pointer-events:none;z-index:4}
#camera,#preview,#result{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#camera{transform:scaleX(-1)}
.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;text-shadow:0 0 10px #64577b}
.placeholder .gem{font-size:75px;line-height:1.5;animation:glow 2s ease-in-out infinite alternate}
.placeholder p{font-size:11px;letter-spacing:2px}
@keyframes glow{to{filter:drop-shadow(0 0 13px white);transform:scale(1.15)}}
.star{position:absolute;z-index:5;text-shadow:0 0 15px white;pointer-events:none}.star.a{top:14%;left:7%;font-size:26px}.star.b{right:7%;top:44%;font-size:24px}.star.c{left:11%;bottom:19%;font-size:18px}
.scanline{display:none;position:absolute;z-index:5;left:4%;width:92%;height:3px;background:white;box-shadow:0 0 15px 6px #b3ddff;animation:scan 2.4s linear infinite}
@keyframes scan{0%,100%{top:15%}50%{top:83%}}
.status{position:absolute;z-index:6;left:8%;bottom:17px;width:84%;padding:10px 12px;text-align:center;font-size:11px;line-height:1.4;letter-spacing:1px;background:#594966b8;border:1px solid #fffa;border-radius:18px;overflow-wrap:anywhere}
.status.error{background:#74364dcf}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 9px}
.action{font-size:11px;padding:13px 15px}.action.primary{background:#f4e1ff;color:#735081;font-weight:bold}.action:disabled{opacity:.55;cursor:wait}
#filePicker{display:none}
.note{text-align:center;font:11px/1.5 Arial,sans-serif;color:#fff;max-width:380px;margin:8px auto}
.note label{display:inline-flex;gap:7px;align-items:center}.note input{accent-color:#8b68ac}
.message{text-align:center;font:12px/1.5 Georgia,serif;color:#fff;margin:9px auto;min-height:18px}
[hidden]{display:none!important}
@media(min-width:650px){.stage{height:590px}}
</style>
</head>
<body>
<main class="app" id="app" data-look="pink">
  <header class="brand"><h1>SHUSHU/TONG</h1><p>EVERY FACE, A DIFFERENT IDENTITY</p></header>
  <div class="ornament">✧ ❈ ✧</div>
  <nav class="look-switch" aria-label="Choose identity">
    <button id="pink" aria-pressed="true">✿ PINK IDENTITY</button>
    <button id="blue" aria-pressed="false">✧ BLUE IDENTITY</button>
  </nav>
  <section class="stage" aria-label="Camera and AI transformation">
    <div class="placeholder" id="placeholder"><span class="gem">✧</span><p>DISCOVER YOUR VIRTUAL SELF</p></div>
    <video id="camera" autoplay playsinline muted></video>
    <img id="preview" alt="Selfie preview" />
    <img id="result" alt="AI-generated SHUSHU/TONG character" />
    <span class="star a">✧</span><span class="star b">✦</span><span class="star c">✧</span>
    <div class="scanline" id="scanline"></div>
    <div class="status" id="status" role="status" aria-live="polite">READY TO ENTER THE GAME</div>
  </section>
  <div class="actions">
    <button class="action" id="start">START CAMERA</button>
    <button class="action primary" id="transform" disabled>✧ TRANSFORM ✧</button>
    <label class="action" id="fallback" for="filePicker">UPLOAD SELFIE</label>
    <input id="filePicker" type="file" accept="image/jpeg,image/png,image/webp" />
    <button class="action" id="save" hidden>SAVE IMAGE</button>
    <button class="action" id="reset" hidden>TRY AGAIN</button>
  </div>
  <div class="note"><label><input type="checkbox" id="consent" /> I agree to send my selfie to AI for this transformation</label></div>
  <p class="note">A photo is sent to the AI service only when you tap TRANSFORM. Use your own photo or one you have permission to use.</p>
  <p class="message" id="hint">Choose a look, open the camera or upload a selfie.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const video=$('camera'),preview=$('preview'),result=$('result');
let stream=null,look='pink',selfie=null,busy=false;
function say(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function show(which){for(const id of ['placeholder','camera','preview','result'])$(id).style.display=id===which?(id==='placeholder'?'grid':'block'):'none';}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
function choose(value){if(busy)return;look=value;$('app').dataset.look=value;for(const l of ['pink','blue'])$(l).setAttribute('aria-pressed',String(l===value));say(`${value.toUpperCase()} IDENTITY SELECTED`);}
$('pink').onclick=()=>choose('pink');$('blue').onclick=()=>choose('blue');
async function startCamera(){if(busy)return;try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera needs HTTPS and browser permission');stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:1280}},audio:false});video.srcObject=stream;await video.play();selfie=null;show('camera');$('transform').disabled=false;$('start').textContent='RESTART CAMERA';say('FACE YOUR CAMERA — READY');}
catch(e){say('CAMERA UNAVAILABLE — UPLOAD SELFIE INSTEAD',true);$('hint').textContent=e.message;}}
$('start').onclick=startCamera;
function jpegFrom(source,mirror=false){const iw=source.videoWidth||source.naturalWidth,ih=source.videoHeight||source.naturalHeight;if(!iw||!ih)throw new Error('Photo is not ready');const factor=Math.min(840/iw,1260/ih,1),w=Math.max(1,Math.round(iw*factor)),h=Math.max(1,Math.round(ih*factor));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');if(mirror){ctx.translate(w,0);ctx.scale(-1,1);}ctx.drawImage(source,0,0,w,h);return c.toDataURL('image/jpeg',.72);}
function loadPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{resolve(jpegFrom(img));}catch(e){reject(e);}};img.onerror=()=>reject(new Error('Cannot read this image'));img.src=reader.result;};reader.onerror=()=>reject(new Error('Cannot read this file'));reader.readAsDataURL(file);});}
$('filePicker').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(!file.type.startsWith('image/'))throw new Error('Select a photo');if(file.size>12*1024*1024)throw new Error('Upload a photo smaller than 12 MB');selfie=await loadPhoto(file);stopCamera();preview.src=selfie;show('preview');$('transform').disabled=false;say('SELFIE READY — PRESS TRANSFORM');}catch(err){say(err.message,true);}};
$('transform').onclick=async()=>{if(busy)return;if(!$('consent').checked){say('PLEASE TICK THE CONSENT CHECKBOX',true);return;}try{if(!selfie){if(!stream||!video.videoWidth)throw new Error('START CAMERA OR UPLOAD SELFIE');selfie=jpegFrom(video,true);preview.src=selfie;stopCamera();show('preview');}if(location.hostname.endsWith('github.io'))throw new Error('Use the Vercel link, not GitHub Pages');
busy=true;$('transform').disabled=true;$('start').disabled=true;$('scanline').style.display='block';say('AI IS CREATING YOUR VIRTUAL IDENTITY...');$('hint').textContent='This can take a little time. Do not close the page.';
const response=await fetch('/api/transform',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo:selfie,look})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Server error ${response.status}`);if(!data.image)throw new Error('AI returned no image');result.src=data.image;await result.decode();show('result');say('YOUR NEW IDENTITY IS UNLOCKED');$('start').hidden=true;$('transform').hidden=true;$('fallback').hidden=true;$('save').hidden=false;$('reset').hidden=false;$('hint').textContent='Save your SHUSHU/TONG virtual identity.';
}catch(e){say(`FAILED — ${e.message}`,true);$('hint').textContent='Check the error above, then try again.';}finally{busy=false;$('transform').disabled=false;$('start').disabled=false;$('scanline').style.display='none';}};
$('save').onclick=()=>{if(!result.src)return;const a=document.createElement('a');a.href=result.src;a.download=`SHUSHUTONG-${look}-identity.jpg`;document.body.append(a);a.click();a.remove();};
$('reset').onclick=()=>{stopCamera();selfie=null;preview.removeAttribute('src');result.removeAttribute('src');show('placeholder');$('start').hidden=false;$('transform').hidden=false;$('fallback').hidden=false;$('save').hidden=true;$('reset').hidden=true;$('start').disabled=false;$('transform').disabled=true;$('start').textContent='START CAMERA';say('READY TO ENTER THE GAME');$('hint').textContent='Choose a look, open the camera or upload a selfie.';};
show('placeholder');
</script>
</body>
</html>
